<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="robots" content="noindex, nofollow">
<title>Notes</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #000; color: #6a6a6a;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header { padding: 14px 18px 4px; font-size: 13px; font-weight: 600; opacity: .3; }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 6px 14px 14px; }
  textarea {
    height: 40vh; flex: none; width: 100%;
    border: none; outline: none; resize: none;
    background: #0a0a0a; color: #c9c9c9;
    border-radius: 12px; padding: 16px;
    font-size: 24px; line-height: 1.25; font-weight: 500;
    box-shadow: none;
  }
  .bar { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  button {
    flex: 1; border: none; border-radius: 12px;
    padding: 16px; font-size: 18px; font-weight: 600;
    background: #161616; color: #8a8a8a;
    transition: transform .05s ease, background .15s ease, opacity .15s ease;
  }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .5; }
  button.ok { background: #12331d; color: #79c692; }
  button.err { background: #351512; color: #cf847c; }
  #status { min-height: 18px; margin: 10px 4px 0; font-size: 13px; opacity: .35; }
  #nokey { padding: 24px 18px; font-size: 15px; line-height: 1.5; color: #6a6a6a; }
</style>
</head>
<body>
  <header>Notes</header>
  <main id="app" hidden>
    <textarea id="box" autofocus autocomplete="off" autocorrect="off"
      autocapitalize="words" spellcheck="false" enterkeyhint="send"
      placeholder="Type here"></textarea>
    <div class="bar">
      <button id="send">Send</button>
    </div>
    <div id="status"></div>
  </main>
  <div id="nokey" hidden>This link is missing its code. Ask for the full link and open that one.</div>

<script>
(function () {
  // The link code comes from the link that was texted: ?t=... (or #t=...). It is
  // NOT the board key -- just a gate the backend checks before forwarding.
  function param(name) {
    var q = new URLSearchParams(location.search).get(name);
    if (q) return q;
    var h = new URLSearchParams((location.hash || '').replace(/^#/, '')).get(name);
    return h || '';
  }
  var token = (param('t') || '').trim();
  var app = document.getElementById('app');
  var nokey = document.getElementById('nokey');
  if (!token) { nokey.hidden = false; return; }
  app.hidden = false;

  var box = document.getElementById('box');
  var send = document.getElementById('send');
  var status = document.getElementById('status');
  var busy = false;
  var resetTimer = null;

  function flash(text, cls) {
    send.textContent = text;
    send.className = cls || '';
    clearTimeout(resetTimer);
    resetTimer = setTimeout(function () {
      send.textContent = 'Send'; send.className = '';
    }, 1400);
  }

  async function submit() {
    var word = box.value.trim();
    if (!word || busy) return;
    busy = true; send.disabled = true; status.textContent = 'Sending...';
    try {
      var res = await fetch('/api/mb-send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: word, token: token }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      box.value = '';
      status.textContent = '';
      flash('Sent ✓', 'ok');
      box.focus();
    } catch (e) {
      status.textContent = 'Not sent -- check signal and tap Send again.';
      flash('Try again', 'err');
    } finally {
      busy = false; send.disabled = false;
    }
  }

  send.addEventListener('click', submit);
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
  });
})();
</script>
</body>
</html>
